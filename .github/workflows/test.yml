name: Test Pipeline

on:
  pull_request:
    branches: [ main, develop ]
  push:
    branches: [ main, develop ]

env:
  NODE_VERSION: '20'
  MINIMUM_COVERAGE: 80

jobs:
  test-backend-coverage:
    name: Backend Test Coverage
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: lumina
          POSTGRES_PASSWORD: lumina_password
          POSTGRES_DB: lumina_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        working-directory: ./backend
        run: npm ci

      - name: Run tests with coverage
        working-directory: ./backend
        run: npm run test:cov
        env:
          DATABASE_HOST: localhost
          DATABASE_PORT: 5432
          DATABASE_USER: lumina
          DATABASE_PASSWORD: lumina_password
          DATABASE_NAME: lumina_test
          REDIS_HOST: localhost
          REDIS_PORT: 6379

      - name: Check coverage threshold
        working-directory: ./backend
        run: |
          COVERAGE=$(cat coverage/coverage-summary.json | jq '.total.lines.pct')
          echo "Current coverage: $COVERAGE%"
          if (( $(echo "$COVERAGE < $MINIMUM_COVERAGE" | bc -l) )); then
            echo "❌ Coverage $COVERAGE% is below minimum $MINIMUM_COVERAGE%"
            exit 1
          fi
          echo "✅ Coverage $COVERAGE% meets minimum $MINIMUM_COVERAGE%"

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          file: ./backend/coverage/lcov.info
          flags: backend
          name: backend-coverage

      - name: Upload coverage artifacts
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/coverage
          retention-days: 7

  test-frontend-coverage:
    name: Frontend Test Coverage
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Run tests with coverage
        working-directory: ./frontend
        run: npm test -- --coverage

      - name: Check coverage threshold
        working-directory: ./frontend
        run: |
          COVERAGE=$(cat coverage/coverage-summary.json | jq '.total.lines.pct')
          echo "Current coverage: $COVERAGE%"
          if (( $(echo "$COVERAGE < $MINIMUM_COVERAGE" | bc -l) )); then
            echo "❌ Coverage $COVERAGE% is below minimum $MINIMUM_COVERAGE%"
            exit 1
          fi
          echo "✅ Coverage $COVERAGE% meets minimum $MINIMUM_COVERAGE%"

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          file: ./frontend/coverage/lcov.info
          flags: frontend
          name: frontend-coverage

      - name: Upload coverage artifacts
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: frontend/coverage
          retention-days: 7

  test-contracts-coverage:
    name: Smart Contracts Test Coverage
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          rust-version: stable

      - name: Install tarpaulin for coverage
        run: cargo install cargo-tarpaulin

      - name: Run tests with coverage
        working-directory: ./smartcontracts
        run: cargo tarpaulin --out Xml --output-dir ./coverage

      - name: Check coverage threshold
        working-directory: ./smartcontracts
        run: |
          COVERAGE=$(grep -oP 'line-rate="\K[0-9.]+' coverage/cobertura.xml | head -1)
          COVERAGE_PCT=$(echo "$COVERAGE * 100" | bc)
          echo "Current coverage: $COVERAGE_PCT%"
          if (( $(echo "$COVERAGE_PCT < $MINIMUM_COVERAGE" | bc -l) )); then
            echo "❌ Coverage $COVERAGE_PCT% is below minimum $MINIMUM_COVERAGE%"
            exit 1
          fi
          echo "✅ Coverage $COVERAGE_PCT% meets minimum $MINIMUM_COVERAGE%"

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          file: ./smartcontracts/coverage/cobertura.xml
          flags: smartcontracts
          name: contracts-coverage

      - name: Upload coverage artifacts
        uses: actions/upload-artifact@v4
        with:
          name: contracts-coverage
          path: smartcontracts/coverage
          retention-days: 7

  coverage-report:
    name: Generate Coverage Report
    runs-on: ubuntu-latest
    needs: [test-backend-coverage, test-frontend-coverage, test-contracts-coverage]
    if: always()
    steps:
      - name: Download backend coverage
        uses: actions/download-artifact@v4
        with:
          name: backend-coverage
          path: coverage/backend

      - name: Download frontend coverage
        uses: actions/download-artifact@v4
        with:
          name: frontend-coverage
          path: coverage/frontend

      - name: Download contracts coverage
        uses: actions/download-artifact@v4
        with:
          name: contracts-coverage
          path: coverage/contracts

      - name: Generate combined coverage report
        run: |
          echo "# Coverage Report" > coverage-report.md
          echo "" >> coverage-report.md
          echo "## Backend" >> coverage-report.md
          if [ -f coverage/backend/coverage-summary.json ]; then
            cat coverage/backend/coverage-summary.json >> coverage-report.md
          fi
          echo "" >> coverage-report.md
          echo "## Frontend" >> coverage-report.md
          if [ -f coverage/frontend/coverage-summary.json ]; then
            cat coverage/frontend/coverage-summary.json >> coverage-report.md
          fi
          echo "" >> coverage-report.md
          echo "## Smart Contracts" >> coverage-report.md
          if [ -f coverage/contracts/cobertura.xml ]; then
            cat coverage/contracts/cobertura.xml >> coverage-report.md
          fi

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: combined-coverage-report
          path: coverage-report.md
          retention-days: 30

      - name: Comment coverage on PR
        uses: actions/github-script@v7
        if: github.event_name == 'pull_request'
        with:
          script: |
            const fs = require('fs');
            const report = fs.readFileSync('coverage-report.md', 'utf8');
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: report
            });
